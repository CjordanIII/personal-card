<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GreenPal Exporter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>GreenPal Exporter</h1>
      <p class="hint">Open your customers page, add optional extra columns, then click Start Export.</p>

      <label for="taxRate">Tax rate (%)</label>
      <input id="taxRate" type="number" min="0" step="0.01" placeholder="8.25" />

      <label for="extraCols">Extra column titles (comma separated)</label>
      <input id="extraCols" type="text" placeholder="Route,Notes,Paid" />

      <button id="startBtn">Start Export</button>
      <p id="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
